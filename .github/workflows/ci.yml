name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  jwt_secret_guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JWT_HMAC_KEY customization
        run: python3 scripts/check_jwt_key.py --env-file .env

  collector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
        shell: bash
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: End-to-end smoke test
        env:
          CSV_LOG_DIR: ${{ runner.temp }}/csv-logs
        run: |
          mkdir -p "$CSV_LOG_DIR"
          npm run e2e -- --log-dir "$CSV_LOG_DIR" --port 8123

      - name: Audit CSV output
        env:
          CSV_LOG_DIR: ${{ runner.temp }}/csv-logs
        run: |
          npm run audit -- --dir "$CSV_LOG_DIR" --fail-on-error

  session_splitter_cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: make node-build

      - name: Session splitter CLI e2e tests
        run: pnpm --filter @logserver/session-splitter-cli test

  workspace_packages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: make node-build

      - name: Test all workspaces
        run: pnpm -r run test

  trainer:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: trainer
    env:
      GPU_MODE: ada6000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: trainer/requirements_cpu.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements_cpu.txt

      - name: CLI smoke checks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m trainer.scripts.preprocess --help >/dev/null
          python -m trainer.scripts.train --help >/dev/null
          python -m trainer.scripts.score --help >/dev/null
          python -m trainer.scripts.threshold --help >/dev/null
          python -m trainer.scripts.explain --help >/dev/null
          python -m trainer.scripts.export_simulink --help >/dev/null

      - name: Run trainer tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --maxfail=1 --disable-warnings -q
