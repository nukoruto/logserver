[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dt-cv"
version = "0.1.0"
description = "Deterministic rolling-origin cross-validation orchestrator for Δt anomaly pipelines"
requires-python = ">=3.11"
authors = [{ name = "LogServer Team" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[project.scripts]
"tscv" = "dt_cv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
packages = ["dt_cv"]
