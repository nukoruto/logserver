runtime:
  seed: __SEED__
  device: "__DEVICE__"
  cuda_visible_devices: "__CUDA_VISIBLE__"
model:
  type: lstm_predictor
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
training:
  batch_size: 64
  max_epochs: 20
  early_stopping_patience: 5
  learning_rate: 0.001
features:
  include_delta_t: true
  delta_t_clip: [0.0, 30.0]
  embedding_dim: 128
