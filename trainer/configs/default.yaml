# Default training configuration
# Aligns with README section 11 for reproducible experiments.
data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  sample_dir: data/sample
session:
  idle_timeout: 1800
  tz: UTC
features:
  event_vocab: 512
  embedding_dim: 64
  dt_method: inter_arrival
  latency_clip_ms: 30000
model:
  type: lstm_delta
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
training:
  batch_size: 64
  max_epochs: 20
  learning_rate: 0.001
  seed: 42
  validation_split: 0.1
  early_stopping_patience: 3
scoring:
  window: session
  smoothing: moving_average
  smoothing_window: 5
threshold:
  method: quantile
  quantile: 0.995
  target_alpha: 0.005
  normal_reference: scores_reference_normal.csv
logging:
  level: INFO
  dir: runs
