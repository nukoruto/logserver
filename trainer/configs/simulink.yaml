# Simulink export and comparison settings
# Conforms to README section 11 formatting guidelines.
export:
  weights_path: runs/latest/lstm_weights.pt
  metadata_path: runs/latest/model_spec.json
  format: mat
  input_signature:
    features:
      - event_id
      - delta_t
      - latency_ms
      - status_code
    rates_hz: 10
  output_signature:
    anomaly_score: float32
    control_action: float32
compare:
  pid:
    kp: 0.8
    ki: 0.05
    kd: 0.02
  reference_profile: data/sample/reference_profile.csv
  disturbance_profile: data/sample/disturbance_profile.csv
